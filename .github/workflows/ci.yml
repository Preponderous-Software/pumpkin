name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carve:
    name: Carving rules and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the carving library and tests (no engine)
        run: |
          cmake -S . -B build -DPUMPKIN_WARNINGS_AS_ERRORS=ON
          cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure
